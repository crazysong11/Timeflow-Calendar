[package]
name = "timeflow-calendar"
version = "1.0.1"
license = "GPL-3.0-only"
description = "A continuous timeline calendar for Windows"
edition = "2021"

[lib]
name = "timeflow_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-single-instance = "2.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
