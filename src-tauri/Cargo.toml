[package]
name = "timeflow-calendar"
version = "0.1.0"
description = "A continuous timeline calendar for Windows"
edition = "2021"

[lib]
name = "timeflow_calendar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
